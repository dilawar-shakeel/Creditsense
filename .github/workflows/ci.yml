name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fix 0-F: the project is built and locked with uv (pyproject.toml + uv.lock),
      # but CI was installing from requirements.txt with plain pip — CI could pass on
      # a dependency set that `uv sync` would never produce, or fail on one it would.
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest
