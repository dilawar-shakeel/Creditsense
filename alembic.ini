[alembic]
script_location = src/creditsense/db/migrations
prepend_sys_path = src
# Fix 0-E: not read. env.py overrides this at runtime from Settings.database_url
# (src/creditsense/config.py, via .env's DATABASE_URL) so alembic always talks to the
# same database the app does. Left blank rather than a stale-looking URL so nobody
# edits this line expecting it to do anything.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
