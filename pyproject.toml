[project]
name = "creditsense"
version = "0.1.0"
description = "SME credit risk and SBP regulatory compliance assistant"
readme = "README.md"
authors = [
    { name = "Dilawar Shakeel", email = "acct7415@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic==1.14.0",
    "fastapi>=0.118.0",
    "httpx==0.27.2",
    "joblib>=1.3.0",
    "mcp==2.1.1",
    "numpy>=2.5.3",
    "openai>=1.50.0",
    "pandas>=2.0.0",
    "pgvector==0.3.6",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings==2.4.0",
    "pypdf>=5.0.0",
    "pytest==8.3.3",
    "python-dotenv==1.0.1",
    "ruff==0.6.9",
    "scikit-learn>=1.6.0",
    "shap>=0.46.0",
    "sqlalchemy==2.0.36",
    "structlog==24.4.0",
    "uvicorn>=0.31.1",
    "xgboost>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]

[project.scripts]
creditsense = "creditsense:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
