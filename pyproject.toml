[project]
name = "creditsense"
version = "0.1.0"
description = "SME credit risk and SBP regulatory compliance assistant"
readme = "README.md"
authors = [
    { name = "Dilawar Shakeel", email = "acct7415@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic==1.14.0",
    "fastapi>=0.118.0",
    "httpx==0.27.2",
    "joblib>=1.3.0",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "mcp==2.1.1",
    "numpy>=2.5.3",
    "openai>=1.50.0",
    "pandas>=2.0.0",
    "pgvector==0.3.6",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings==2.4.0",
    "pypdf>=5.0.0",
    "pytest==8.3.3",
    "pytest-cov>=6.0.0",
    "python-dotenv==1.0.1",
    "python-multipart>=0.0.9",
    "ruff==0.6.9",
    "scikit-learn>=1.6.0",
    "shap>=0.46.0",
    "sqlalchemy==2.0.36",
    "structlog==24.4.0",
    "uvicorn>=0.31.1",
    "xgboost>=2.0.0",
]

[dependency-groups]
# Dev/test tooling only -- deliberately absent from requirements.txt, which is what
# the Docker image actually installs (see Dockerfile). reportlab is only ever needed
# to author the fillable intake PDF template (scripts/generate_intake_template.py) and
# to build a real filled copy of it in test_document_intake.py; the running app only
# ever reads PDFs, via pypdf, which is a real runtime dependency.
dev = ["reportlab>=4.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# P8.2: `live` tests hit the real Docker stack (Postgres + the app's own ML endpoint)
# and real OpenAI, so they are deselected by default -- the rest of the suite stays
# fully offline and CI-safe. Run them deliberately with `uv run pytest -m live`.
markers = [
    "live: requires the running Docker stack and a real OPENAI_API_KEY",
]
addopts = "-m 'not live'"

[tool.coverage.run]
# Explicit source rather than relying on `--cov=creditsense` auto-discovery, which was
# silently omitting rag/ingest.py from the report entirely (not reporting it at 0% --
# leaving it out, which quietly inflates the total). P8.1's coverage number is only
# worth recording if it counts every module.
source = ["src/creditsense"]
omit = ["*/migrations/*", "*/notebooks/*"]

[tool.ruff]
line-length = 88
src = ["src"]

[project.scripts]
creditsense = "creditsense:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
