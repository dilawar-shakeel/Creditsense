<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CreditSense — Portfolio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="app.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<nav class="bg-white border-b border-slate-200 px-6 py-3 flex items-center gap-6">
  <span class="font-bold text-lg">CreditSense</span>
  <a href="index.html" class="text-sm text-slate-500 hover:text-slate-900">Work Queue</a>
  <a href="regulations.html" class="text-sm text-slate-500 hover:text-slate-900">Regulations</a>
  <a href="portfolio.html" class="text-sm font-medium text-slate-900">Portfolio</a>
  <a href="audit.html" class="text-sm text-slate-500 hover:text-slate-900">Audit Trail</a>
</nav>

<main class="max-w-3xl mx-auto px-6 py-8">
  <h1 class="text-2xl font-bold mb-1">Portfolio — Sector Exposure</h1>
  <p class="text-slate-500 text-sm mb-6">
    Against clause P-1's 25% single-sector concentration limit.
  </p>
  <div id="content"></div>
</main>

<script>
const { el, fetchJSON, skeleton, errorState, fmtPKR } = CS;

async function load() {
  const content = document.getElementById("content");
  content.appendChild(skeleton(6));
  try {
    const data = await fetchJSON("/api/portfolio/exposure");
    content.innerHTML = "";
    const limit = data.sector_concentration_limit_pct;
    const maxPct = Math.max(limit, ...data.rows.map((r) => r.pct_of_book), 1);

    const chart = el("div", { class: "bg-white border border-slate-200 rounded-lg p-5 mb-6 space-y-3" });
    data.rows.forEach((r) => {
      const width = (r.pct_of_book / maxPct) * 100;
      const overLimit = r.pct_of_book > limit;
      chart.appendChild(el(
        "div", {},
        el("div", { class: "flex justify-between text-sm mb-0.5" },
          el("span", { class: "font-medium" }, r.sector),
          el("span", { class: overLimit ? "text-red-700 font-semibold" : "text-slate-600" }, `${r.pct_of_book.toFixed(2)}%`)
        ),
        el("div", { class: "relative h-4 bg-slate-100 rounded", html:
          `<div style="width:${width}%;height:100%;border-radius:4px;background:${overLimit ? '#dc2626' : '#4338ca'}"></div>` })
      ));
    });
    const limitLine = el("div", { class: "text-xs text-slate-500 pt-2 border-t border-slate-200" },
      `Reference: ${limit}% policy limit (clause P-1)`);
    chart.appendChild(limitLine);
    content.appendChild(chart);

    const table = el("table", { class: "w-full text-sm bg-white border border-slate-200 rounded-lg overflow-hidden" });
    table.appendChild(el("thead", {},
      el("tr", { class: "bg-slate-50 text-left" },
        el("th", { class: "px-4 py-2" }, "Sector"),
        el("th", { class: "px-4 py-2" }, "Applicants"),
        el("th", { class: "px-4 py-2" }, "Total exposure"),
        el("th", { class: "px-4 py-2" }, "% of book"))
    ));
    const tbody = el("tbody", {});
    data.rows.forEach((r) => {
      tbody.appendChild(el("tr", { class: "border-t border-slate-100" },
        el("td", { class: "px-4 py-2" }, r.sector),
        el("td", { class: "px-4 py-2" }, String(r.applicant_count)),
        el("td", { class: "px-4 py-2" }, fmtPKR(r.total_exposure_pkr)),
        el("td", { class: "px-4 py-2" }, `${r.pct_of_book.toFixed(2)}%`)
      ));
    });
    table.appendChild(tbody);
    content.appendChild(table);
  } catch (err) {
    content.innerHTML = "";
    content.appendChild(errorState(err.message));
  }
}

load();
</script>
</body>
</html>
